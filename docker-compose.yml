version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: curiocity-postgres
    environment:
      POSTGRES_USER: wanderwise
      POSTGRES_PASSWORD: wanderwise123
      POSTGRES_DB: wanderwise
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wanderwise']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: curiocity-api
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wanderwise:wanderwise123@postgres:5432/wanderwise
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env}
      CORS_ORIGIN: http://localhost:3002
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-curiocity-uploads}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npm run db:migrate && npm run db:seed && npm start"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: curiocity-web
    ports:
      - '3002:80'
    depends_on:
      - api

volumes:
  pgdata:
